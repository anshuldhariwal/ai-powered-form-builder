name: ${COMPOSE_PROJECT_NAME:-formforge}

x-php-build: &php-build
  context: .
  dockerfile: docker/php/Dockerfile
  args:
    APP_UID: ${HOST_UID:-1000}
    APP_GID: ${HOST_GID:-1000}

x-node-build: &node-build
  context: .
  dockerfile: docker/node/Dockerfile
  args:
    APP_UID: ${HOST_UID:-1000}
    APP_GID: ${HOST_GID:-1000}

x-laravel-environment: &laravel-environment
  APP_NAME: ${APP_NAME:-FormForge AI}
  APP_ENV: ${APP_ENV:-local}
  APP_KEY: ${APP_KEY:?Copy .env.example to .env and set APP_KEY}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:8080}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-formforge}
  DB_USERNAME: ${DB_USERNAME:-formforge}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  SESSION_DRIVER: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: "null"
  AI_SERVICE_URL: http://ai-service:8000
  AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:?Set AI_SERVICE_SECRET in .env}
  AI_SERVICE_MAX_CLOCK_SKEW_SECONDS: ${AI_SERVICE_MAX_CLOCK_SKEW_SECONDS:-300}
  AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-password}

x-laravel-volumes: &laravel-volumes
  - ./src:/var/www/html:ro
  - ./contracts:/var/www/contracts:ro
  - laravel-vendor:/var/www/html/vendor
  - laravel-storage:/var/www/html/storage
  - laravel-bootstrap-cache:/var/www/html/bootstrap/cache

services:
  app-init:
    build:
      <<: *php-build
      target: app-init
    environment: *laravel-environment
    volumes: *laravel-volumes
    networks:
      - private
    restart: "no"

  frontend-init:
    build:
      <<: *node-build
      target: frontend-init
    depends_on:
      app-init:
        condition: service_completed_successfully
    volumes:
      - ./src:/var/www/html:ro
      - node-modules:/var/www/html/node_modules
      - laravel-storage:/var/www/html/storage
    networks:
      - private
    restart: "no"

  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-formforge}
      MYSQL_USER: ${DB_USERNAME:-formforge}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - private
    restart: unless-stopped

  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    volumes:
      - redis-data:/data
    networks:
      - private
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:?Set AI_SERVICE_SECRET in .env}
      AI_SERVICE_MAX_CLOCK_SKEW_SECONDS: ${AI_SERVICE_MAX_CLOCK_SKEW_SECONDS:-300}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - private
    restart: unless-stopped

  php:
    build:
      <<: *php-build
      target: development
    environment: *laravel-environment
    depends_on:
      app-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    volumes: *laravel-volumes
    networks:
      - private
    restart: unless-stopped

  horizon:
    build:
      <<: *php-build
      target: development
    command: ["php", "artisan", "horizon"]
    environment: *laravel-environment
    depends_on:
      app-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: *laravel-volumes
    networks:
      - private
    restart: unless-stopped

  vite:
    build:
      <<: *node-build
      target: development
    environment:
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
    depends_on:
      frontend-init:
        condition: service_completed_successfully
    volumes:
      - ./src:/var/www/html:ro
      - node-modules:/var/www/html/node_modules
      - laravel-storage:/var/www/html/storage
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - private
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    depends_on:
      php:
        condition: service_started
      vite:
        condition: service_started
    volumes:
      - ./src:/var/www/html:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    networks:
      - private
    restart: unless-stopped

networks:
  private:
    driver: bridge

volumes:
  laravel-vendor:
  laravel-storage:
  laravel-bootstrap-cache:
  node-modules:
  mysql-data:
  redis-data:
