[project]
name = "formforge-ai-service"
version = "0.1.0"
description = "Deterministic structured-output AI service for FormForge AI."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic-settings",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
